[build-system]
requires = [
    "scikit-build-core>=0.5.0",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "RigidBodyLight"
version = "0.4.0"
description = "Rigid body simulation with nanobind"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy",
    "scikit-sparse>=0.5",
    "pyamg",
]

[tool.scikit-build.cmake.define]
DOUBLEPRECISION = 0