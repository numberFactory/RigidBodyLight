name: upload_conda

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  conda_deployment:
    name: Conda deployment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conda environment creation and activation
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.13"
          environment-file: recipe/build_env.yaml
          auto-update-conda: false
          auto-activate-base: false
          show-channel-urls: true
          conda-remove-defaults: true

      - name: Diagnose conda
        shell: bash -el {0}
        run: |
          echo "PATH:"
          echo "$PATH"
          echo
          echo "CONDA:"
          echo "$CONDA"
          echo
          echo "which conda:"
          which conda
          echo
          echo "conda version:"
          conda --version
          echo
          echo "conda info:"
          conda info
          echo
          echo "conda list:"
          conda list
          echo
          echo "which conda-build:"
          which conda-build || true
          echo
          echo "conda-build version:"
          conda-build --version || true
          echo
          echo "conda build version:"
          conda build --version || true

      - name: Build and upload the conda packages
        uses: uibcdf/action-build-and-upload-conda-packages@v2.0.3
        with:
          meta_yaml_dir: recipe
          user: stochasticHydroTools
          overwrite: true
          upload: true
          label: main
          token: ${{ secrets.ANACONDA_TOKEN }}